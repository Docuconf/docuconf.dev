name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deploys run one at a time and a running deploy is never cancelled. PR builds get
# their own group, so a PR push cannot replace a pending production deploy.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run lint
      # Pages name SDKs only through src/lib/sdk-data.ts, and every snippet it points at exists.
      - run: npm run check:content
      # next build, then the Pagefind search index.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # "" with a custom domain, "/docuconf.dev" on docuconf.github.io.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Absolute URLs in JSON-LD, the sitemap and llms.txt. Falls back to
          # https://docuconf.dev for pull-request builds.
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out
          # v4 and later leave dotfiles out unless asked; v3 kept them.
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
